<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Checker</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background:#0f172a;
  color:white;
}

/* LANDSCAPE ONLY */
#rotateWarning {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  color:white;
  font-size:22px;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

@media screen and (orientation: portrait) {
  #rotateWarning { display:flex; }
  #mainContent { display:none; }
}

h2 { text-align:center; margin:10px; }

.container { overflow-x:auto; }

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1000px;
  background: #1e293b;
}

th, td {
  border: 1px solid #334155;
  padding: 6px;
  text-align: center;
  font-size: 12px;
}

th { background:#020617; }

td.name { text-align:left; }

td.clickable { cursor:pointer; }

.checked {
  background:#22c55e;
  color:black;
  font-weight:bold;
}

button {
  margin:10px;
  padding:10px;
  border:none;
  border-radius:8px;
}

.export { background:#22c55e; color:black; }
.reset { background:#ef4444; color:white; }

</style>
</head>

<body>

<div id="rotateWarning">
  กรุณาหมุนหน้าจอเป็นแนวนอน 📱➡️
</div>

<div id="mainContent">

<h2>📋 ตารางเช็คชื่อ (1–31 วัน)</h2>

<div style="text-align:center;">
  <button class="export" onclick="exportExcel()">Export Excel</button>
  <button class="reset" onclick="resetData()">Reset</button>
</div>

<div class="container">
<table>
<thead>
<tr id="headerRow">
  <th>ลำดับที่</th>
  <th>ชื่อ-สกุล</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

// ===== STUDENTS =====
let students = [
  "สมชาย ใจดี","อนันต์ ดีมาก","นก สบาย",
  "เมย์ สุขใจ","บอย แข็งแรง","เจน ฉลาด",
  "พลอย สวย","มาร์ค เท่","มิ้น น่ารัก",
  "ที ฉลาด","ไอซ์ เย็น","แบงค์ รวย",
  "ฟิล์ม หล่อ","เกมส์ เก่ง","กัน นิสัยดี",
  "วิว สูง","ฝน สดชื่น","บอส ผู้นำ",
  "อาร์ม แข็งแรง","นัท เก่ง"
];

// ===== LOAD DATA =====
let data = JSON.parse(localStorage.getItem("attendance")) || {};

// ===== CREATE HEADER =====
let headerRow = document.getElementById("headerRow");

for(let d=1; d<=31; d++){
  let th = document.createElement("th");
  th.innerText = d;
  headerRow.appendChild(th);
}

let totalTh = document.createElement("th");
totalTh.innerText = "รวม";
headerRow.appendChild(totalTh);

// ===== CREATE TABLE =====
let tbody = document.getElementById("tbody");

students.forEach((name, i)=>{

  let row = document.createElement("tr");

  row.innerHTML += "<td>"+(i+1)+"</td>";
  row.innerHTML += "<td class='name'>"+name+"</td>";

  let total = 0;

  for(let d=1; d<=31; d++){

    let key = i+"_"+d;
    let td = document.createElement("td");
    td.className = "clickable";

    if(data[key]){
      td.classList.add("checked");
      td.innerHTML = "✓";
      total++;
    }

    td.onclick = function(){

      if(!data[key]){
        data[key] = true;
        td.classList.add("checked");
        td.innerHTML = "✓";
      } else {
        delete data[key];
        td.classList.remove("checked");
        td.innerHTML = "";
      }

      localStorage.setItem("attendance", JSON.stringify(data));
      updateTotals();
    };

    row.appendChild(td);
  }

  let totalCell = document.createElement("td");
  totalCell.id = "total_"+i;
  totalCell.innerText = total;

  row.appendChild(totalCell);
  tbody.appendChild(row);
});

// ===== UPDATE TOTAL =====
function updateTotals(){
  students.forEach((_, i)=>{
    let count = 0;
    for(let d=1; d<=31; d++){
      if(data[i+"_"+d]) count++;
    }
    document.getElementById("total_"+i).innerText = count;
  });
}

// ===== EXPORT CSV =====
function exportExcel(){

  let csv = "ลำดับที่,ชื่อ-สกุล,";
  for(let d=1; d<=31; d++) csv += "วันที่"+d+",";
  csv += "รวม\n";

  students.forEach((name,i)=>{
    let row = (i+1)+","+name+",";
    let total = 0;

    for(let d=1; d<=31; d++){
      if(data[i+"_"+d]){
        row += "✓,";
        total++;
      } else {
        row += ",";
      }
    }

    row += total+"\n";
    csv += row;
  });

  let blob = new Blob([csv], {type:"text/csv"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "attendance.csv";
  a.click();
}

// ===== RESET =====
function resetData(){
  if(confirm("ลบข้อมูลทั้งหมด?")){
    localStorage.removeItem("attendance");
    location.reload();
  }
}

</script>

</body>
</html>
