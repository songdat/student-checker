<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Checker</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background:#0f172a;
  color:white;
}

/* LANDSCAPE ONLY */
#rotateWarning {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  color:white;
  font-size:22px;
  justify-content:center;
  align-items:center;
}

@media screen and (orientation: portrait) {
  #rotateWarning { display:flex; }
  #mainContent { display:none; }
}

h2 { text-align:center; }

.container { overflow-x:auto; }

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1200px;
  background: #1e293b;
}

th, td {
  border: 1px solid #334155;
  padding: 5px;
  text-align: center;
  font-size: 12px;
}

th { background:#020617; }

td.name { text-align:left; }
td.clickable { cursor:pointer; }

.checked {
  background:#22c55e;
  color:black;
}

/* ===== STICKY COLUMNS ===== */
th:first-child,
td:first-child {
  position: sticky;
  left: 0;
  width: 50px;
  background: #020617;
  z-index: 3;
}

th:nth-child(2),
td:nth-child(2) {
  position: sticky;
  left: 50px;
  background: #1e293b;
  z-index: 3;
}

/* shadow for better look */
th:nth-child(2),
td:nth-child(2) {
  box-shadow: 2px 0 5px rgba(0,0,0,0.5);
}

/* ===== BUTTONS ===== */
button {
  margin:5px;
  padding:8px;
  border:none;
  border-radius:6px;
}

.month-btn {
  background:#334155;
  color:white;
}

.active-month {
  background:#22c55e;
  color:black;
}

.export { background:#22c55e; }
.reset { background:#ef4444; color:white; }

</style>
</head>

<body>

<div id="rotateWarning">หมุนหน้าจอเป็นแนวนอน</div>

<div id="mainContent">

<h2>📋 ตารางเช็คชื่อ</h2>

<div id="months" style="text-align:center;"></div>

<div style="text-align:center;">
  <button class="export" onclick="exportExcel()">Export Excel</button>
  <button class="reset" onclick="resetData()">Reset เดือนนี้</button>
</div>

<div class="container">
<table>
<thead>
<tr id="headerRow">
  <th>ลำดับที่</th>
  <th>ชื่อ-สกุล</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>

// ===== STUDENTS =====
let students = [
  "นายธนากร  ยังใจ","นางสาวบุญญลักษณ์  ฤกษ์รูจี","นางสาวกัญญารัตน์  แก้วพิลา","นางสาวสุพรรษา  ผิวนวล","นางสาวโศรญา  เหล่ามาลา","นางสาวนฤมล  ชนะดิษฐ์",
  "นางสาวธัญยลักษณ์  บุรีขันธ์","นางสาวสไบทิพย์  สงคราม","นางสาวธัญริตา  อ่อนหวาน","นางสาวกมลพร  นนทกรี","นางสาวมณีริน  เสนศรี","นางสาวอรวรรณ  เปคำผุย",
  "นางสาวพิมพ์พิสุทธิ์  ประชาโรจน์","นางสาวศุภานัน  พิมละออ","นางสาวรชดา  นนทกรี","เด็กชายญาณกวียชญ์  ยะวงษ์ศรี","ชนันญา  พันธุ์เมือง","อริศรา  กัณหา","นฤดม  โคตรคำ","วีรชน  หงษามนุษย์"
  "วราภรณ์  บัวทอง","อาชานัยย์  มีนาคะ","กิตติพงษ์  ตามขมิ้น","ชินดนัย  พิมสลัด","วิชชากร  บุพศิริ","ชไมพร  ชมภูพระ","ฐิติกร  ทองมะโรง","อัษฎาวุธ  นนทะสอน"
  "จันทิมา  ทาแพง","เบญจวัน  สุทธิชัยยา","จันทิมา  บรรหาร","วัชราภรณ์  อานันต์","ธานนท์  เคหะ","ลัทธพล  หอมยา","กิตติธัช  หม่อมบ่าว","ฐิตาภรณ์  พรหมสาขา"
  "อรุโณทัย  นาทราย","กลวัชร  มาพร","รามเทพ  แสนสุข","อนุศรา  บัวทอง","ณัฐพล  จันทร","กัญญารัตน์  จันทศักดิ์","อาภากร  จิตต์รักรบ","ณัฐชนน  แสงพลอย","อุทัยรัตน์  ภาสดา"
];

// ===== CURRENT MONTH =====
let currentMonth = localStorage.getItem("selectedMonth") || (new Date().getMonth() + 1);
currentMonth = parseInt(currentMonth);

// ===== MONTH NAMES =====
let monthNames = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                  "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

// ===== CREATE MONTH BUTTONS =====
let monthDiv = document.getElementById("months");

monthNames.forEach((m, index)=>{
  let btn = document.createElement("button");
  btn.innerText = m;
  btn.className = "month-btn";

  if(index+1 === currentMonth){
    btn.classList.add("active-month");
  }

  btn.onclick = ()=>{
    localStorage.setItem("selectedMonth", index+1);
    location.reload();
  };

  monthDiv.appendChild(btn);
});

// ===== LOAD DATA =====
function loadData(){
  return JSON.parse(localStorage.getItem("attendance_"+currentMonth)) || {};
}

let data = loadData();

// ===== HEADER =====
let headerRow = document.getElementById("headerRow");

for(let d=1; d<=31; d++){
  let th = document.createElement("th");
  th.innerText = d;
  headerRow.appendChild(th);
}

let totalTh = document.createElement("th");
totalTh.innerText = "รวม";
headerRow.appendChild(totalTh);

// ===== TABLE =====
let tbody = document.getElementById("tbody");

students.forEach((name,i)=>{
  let row = document.createElement("tr");

  row.innerHTML += "<td>"+(i+1)+"</td>";
  row.innerHTML += "<td class='name'>"+name+"</td>";

  let total = 0;

  for(let d=1; d<=31; d++){
    let key = i+"_"+d;
    let td = document.createElement("td");
    td.className = "clickable";

    if(data[key]){
      td.classList.add("checked");
      td.innerHTML="✓";
      total++;
    }

    td.onclick = ()=>{
      if(!data[key]){
        data[key]=true;
        td.classList.add("checked");
        td.innerHTML="✓";
      } else {
        delete data[key];
        td.classList.remove("checked");
        td.innerHTML="";
      }

      localStorage.setItem("attendance_"+currentMonth, JSON.stringify(data));
      updateTotals();
    };

    row.appendChild(td);
  }

  let totalCell = document.createElement("td");
  totalCell.id = "total_"+i;
  totalCell.innerText = total;

  row.appendChild(totalCell);
  tbody.appendChild(row);
});

// ===== UPDATE =====
function updateTotals(){
  students.forEach((_,i)=>{
    let count=0;
    for(let d=1; d<=31; d++){
      if(data[i+"_"+d]) count++;
    }
    document.getElementById("total_"+i).innerText = count;
  });
}

// ===== EXPORT =====
function exportExcel(){
  let csv="ลำดับ,ชื่อ,";
  for(let d=1; d<=31; d++) csv+="วัน"+d+",";
  csv+="รวม\n";

  students.forEach((name,i)=>{
    let row=(i+1)+","+name+",";
    let total=0;

    for(let d=1; d<=31; d++){
      if(data[i+"_"+d]){
        row+="✓,";
        total++;
      } else row+=",";
    }

    row+=total+"\n";
    csv+=row;
  });

  let blob=new Blob([csv],{type:"text/csv"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="attendance_month_"+currentMonth+".csv";
  a.click();
}

// ===== RESET =====
function resetData(){
  if(confirm("ลบข้อมูลเดือนนี้?")){
    localStorage.removeItem("attendance_"+currentMonth);
    location.reload();
  }
}

</script>

</body>
</html>
