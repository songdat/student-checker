<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance FIX</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#0f172a;
  color:white;
}

.container{ overflow-x:auto; }

table{
  border-collapse: collapse;
  width:max-content;
  min-width:1200px;
  background:#1e293b;
}

th, td{
  border:1px solid #334155;
  padding:6px;
  text-align:center;
  font-size:12px;
  white-space:nowrap;
}

/* sticky fix */
th:first-child, td:first-child{
  position:sticky;
  left:0;
  background:#020617;
  z-index:10;
  width:60px;
}

th:nth-child(2), td:nth-child(2){
  position:sticky;
  left:60px;
  background:#1e293b;
  z-index:10;
  width:180px;
}

/* CLICK CELL */
td.day{
  cursor:pointer;
  user-select:none;
  font-size:16px;
}

/* CHECK STYLE */
.checked{
  background:#22c55e;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<h3 style="text-align:center;">📋 Attendance FIX VERSION</h3>

<div class="container">
<table>
<thead>
<tr id="head">
  <th>No.</th>
  <th>Name</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<script>

// ===== 20 STUDENTS =====
let students = [
  "Student 1","Student 2","Student 3","Student 4","Student 5",
  "Student 6","Student 7","Student 8","Student 9","Student 10",
  "Student 11","Student 12","Student 13","Student 14","Student 15",
  "Student 16","Student 17","Student 18","Student 19","Student 20"
];

// ===== DATA =====
let data = JSON.parse(localStorage.getItem("att")) || {};

// ===== HEADER =====
let head = document.getElementById("head");

for(let d=1; d<=31; d++){
  let th = document.createElement("th");
  th.innerText = d;
  head.appendChild(th);
}

head.innerHTML += "<th>Total</th>";

// ===== BUILD TABLE =====
function build(){

  let body = document.getElementById("body");
  body.innerHTML = "";

  students.forEach((name,i)=>{

    let tr = document.createElement("tr");

    tr.innerHTML += `<td>${i+1}</td>`;
    tr.innerHTML += `<td>${name}</td>`;

    let total = 0;

    for(let d=1; d<=31; d++){

      let key = i+"_"+d;

      let td = document.createElement("td");
      td.className = "day";

      // SHOW STATE
      if(data[key]){
        td.innerHTML = "✔";
        td.classList.add("checked");
        total++;
      }

      // CLICK EVENT (IMPORTANT FIX)
      td.onclick = function(){

        if(data[key]){
          delete data[key];
          td.innerHTML = "";
          td.classList.remove("checked");
        } else {
          data[key] = true;
          td.innerHTML = "✔";
          td.classList.add("checked");
        }

        localStorage.setItem("att", JSON.stringify(data));
      };

      tr.appendChild(td);
    }

    tr.innerHTML += `<td>${total}</td>`;
    body.appendChild(tr);
  });
}

build();

</script>

</body>
</html>
